---
- name: Deploy Portainer Infrastructure
  hosts: docker_hosts
  become: yes

  tasks:
    - name: Setup Portainer Server
      when: inventory_hostname == 'docker-prod'
      block:
        - name: Create Portainer Server directory
          file:
            path: /opt/portainer
            state: directory
            mode: '0755'

        - name: Create docker-compose.yml for Portainer Server
          copy:
            dest: /opt/portainer/docker-compose.yml
            content: |
              services:
                portainer:
                  image: portainer/portainer-ce:sts
                  container_name: portainer
                  restart: always
                  security_opt:
                    - apparmor:unconfined
                  volumes:
                    - /etc/localtime:/etc/localtime:ro
                    - /var/run/docker.sock:/var/run/docker.sock
                    - portainer_data:/data
                  ports:
                    - "9443:9443"
                    - "8000:8000"
              volumes:
                portainer_data:

        - name: Run Portainer Server
          community.docker.docker_compose_v2:
            project_src: /opt/portainer
            state: present

    - name: Setup Portainer Agent
      when: inventory_hostname in ['docker-dev', 'gitea', 'vpn']
      block:
        - name: Create Portainer Agent directory
          file:
            path: /opt/portainer-agent
            state: directory
            mode: '0755'

        - name: Create docker-compose.yml for Portainer Agent
          copy:
            dest: /opt/portainer-agent/docker-compose.yml
            content: |
              services:
                portainer-agent:
                  image: portainer/agent:latest
                  container_name: portainer-agent
                  restart: always
                  security_opt:
                    - apparmor:unconfined
                  volumes:
                    - /var/run/docker.sock:/var/run/docker.sock
                    - /var/lib/docker/volumes:/var/lib/docker/volumes
                  ports:
                    - "9001:9001"

        - name: Run Portainer Agent
          community.docker.docker_compose_v2:
            project_src: /opt/portainer-agent
            state: present