---
- name: Install Gitea Natively
  hosts: gitea
  become: yes

  vars:
    gitea_version: "1.25.4"
    gitea_user: "git"
    gitea_home: "/home/git"

  tasks:
    - name: Get Gitea secrets from Vault (Delegated to Localhost)
      community.hashi_vault.vault_kv2_get:
        url: "{{ ansible_hashi_vault_url }}"
        auth_method: approle
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
        engine_mount_point: "secrets"
        path: "gitea/config"
        validate_certs: false
      register: vault_result
      delegate_to: localhost
      vars:
        ansible_become: false
      become: no

    - name: Set gitea_secrets fact
      set_fact:
        gitea_secrets: "{{ vault_result.secret }}"

    - name: Create git system user
      user:
        name: "{{ gitea_user }}"
        home: "{{ gitea_home }}"
        shell: /bin/bash
        system: yes

    - name: Create required directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ gitea_user }}"
        group: "{{ gitea_user }}"
        mode: '0755'
      loop:
        - "/var/lib/gitea"
        - "/var/lib/gitea/data"
        - "/var/lib/gitea/custom"
        - "/var/lib/gitea/log"
        - "/etc/gitea"

    - name: Download Gitea binary
      get_url:
        url: "https://github.com/go-gitea/gitea/releases/download/v{{ gitea_version }}/gitea-{{ gitea_version }}-linux-amd64"
        dest: /usr/local/bin/gitea
        mode: '0755'
        owner: root
        group: root

    - name: Configure Gitea (app.ini)
      template:
        src: "{{ playbook_dir }}/../templates/gitea_app.ini.j2"
        dest: /etc/gitea/app.ini
        owner: "{{ gitea_user }}"
        group: "{{ gitea_user }}"
        mode: '0600'
      notify: Restart Gitea

    - name: Setup Systemd unit file
      copy:
        dest: /etc/systemd/system/gitea.service
        content: |
          [Unit]
          Description=Gitea (Git with a cup of tea)
          After=network.target
          After=mariadb.service

          [Service]
          RestartSec=2s
          Type=simple
          User={{ gitea_user }}
          Group={{ gitea_user }}
          WorkingDirectory=/var/lib/gitea/
          ExecStart=/usr/local/bin/gitea web --config /etc/gitea/app.ini
          Restart=always
          Environment=USER={{ gitea_user }} HOME={{ gitea_home }} GITEA_WORK_DIR=/var/lib/gitea

          [Install]
          WantedBy=multi-user.target

    - name: Ensure Gitea is started and enabled
      service:
        name: gitea
        state: started
        enabled: yes

  handlers:
    - name: Restart Gitea
      service:
        name: gitea
        state: restarted