- name: Install fastfetch on Debian
  hosts: all
  remote_user: root
  tasks:
    - name: Ensure .fastfetch directory exists
      file:
        path: "~/.fastfetch"
        state: directory
        mode: '0755'

    - name: Clone fastfetch repository
      git:
        repo: https://github.com/fastfetch-cli/fastfetch.git
        dest: "~/.fastfetch"

    - name: Download fastfetch .deb package
      get_url:
        url: https://github.com/fastfetch-cli/fastfetch/releases/download/2.38.0/fastfetch-linux-amd64.deb
        dest: "~/.fastfetch/fastfetch-linux-amd64.deb"

    - name: Install fastfetch package
      become: yes
      apt:
        deb: "/home/whoami/.fastfetch/fastfetch-linux-amd64.deb"
        state: present
