---
- name: Homelab Nodes Bash & Terminal Configuration
  hosts: all
  become: yes

  vars:
    fastfetch_deb_url: "https://github.com/fastfetch-cli/fastfetch/releases/download/2.60.0/fastfetch-linux-amd64.deb"
    fastfetch_config_url: "https://raw.githubusercontent.com/fastfetch-cli/fastfetch/dev/presets/examples/8.jsonc"

  tasks:
    - name: Ensure Fastfetch is installed
      apt:
        deb: "{{ fastfetch_deb_url }}"
        state: present

    - name: Create Fastfetch config directories
      file:
        path: "{{ item }}/.config/fastfetch"
        state: directory
        owner: "{{ item.split('/')[2] if 'home' in item else 'root' }}"
        mode: '0755'
      loop:
        - "/home/{{ my_user }}"
        - "/root"

    - name: Download Fastfetch preset
      get_url:
        url: "{{ fastfetch_config_url }}"
        dest: "{{ item }}/.config/fastfetch/8.jsonc"
        mode: '0644'
      loop:
        - "/home/{{ my_user }}"
        - "/root"

    - name: Setup Ghostty terminfo for proper terminal support
      block:
        - name: Copy Ghostty terminfo source
          copy:
            src: "../files/ghostty.terminfo"
            dest: "/tmp/ghostty.terminfo"
            mode: '0644'
        - name: Compile terminfo system-wide
          command: tic -x -o /usr/share/terminfo /tmp/ghostty.terminfo
      rescue:
        - name: Log Ghostty failure
          debug:
            msg: "Pominęto kompilację Ghostty terminfo (brak pliku źródłowego)."

    - name: Configure Bashrc for productivity
      blockinfile:
        path: "{{ item }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK V2"
        insertafter: EOF
        create: yes
        mode: '0644'
        block: |
          # Fastfetch - uruchamiaj tylko raz na sesję interaktywną
          if [ -f /usr/bin/fastfetch ] && [[ $- == *i* ]] && [ -z "$FASTFETCH_RUN" ]; then
              fastfetch -c ~/.config/fastfetch/8.jsonc
              export FASTFETCH_RUN=1
          fi

          # Navigation & Listing
          alias ll='ls -lah --group-directories-first'
          alias lt='ls -ltrh'
          alias ..='cd ..'
          alias ...='cd ../..'
          shopt -s autocd 2>/dev/null
          shopt -s cdspell 2>/dev/null

          # Productivity Tools
          alias v='nvim'
          alias vi='nvim'
          alias vim='nvim'
          alias dc='docker compose'
          alias ap='ansible-playbook'
          mkcd() { mkdir -p "$1" && cd "$1"; }
          
          # Git Prompt Integration
          GIT_PROMPT_SCRIPT=""
          for f in "/usr/lib/git-core/git-sh-prompt" "/usr/share/git-core/git-sh-prompt"; do
              [ -f "$f" ] && GIT_PROMPT_SCRIPT="$f" && break
          done
          if [ -n "$GIT_PROMPT_SCRIPT" ]; then
              source "$GIT_PROMPT_SCRIPT"
              export GIT_PS1_SHOWDIRTYSTATE=1
              export GIT_PS1_SHOWUNTRACKEDFILES=1
          fi

          # PROMPT - czysty, bez numeracji linii, z obsługą GIT
          if [ "$USER" = "root" ]; then
              export PS1='\[\e[1;31m\][\u@\h \[\e[1;34m\]\w\[\e[1;31m\]]\[\e[1;33m\]$(__git_ps1 " (%s)")\[\e[0m\] # '
          else
              export PS1='\[\e[1;32m\][\u@\h \[\e[1;34m\]\w\[\e[1;32m\]]\[\e[1;33m\]$(__git_ps1 " (%s)")\[\e[0m\] $ '
          fi
      loop:
        - "/home/{{ my_user }}/.bashrc"
        - "/root/.bashrc"

    - name: Ensure .bashrc is sourced from .profile
      lineinfile:
        path: "{{ item }}/.profile"
        line: "[[ -f ~/.bashrc ]] && . ~/.bashrc"
        create: yes
      loop:
        - "/home/{{ my_user }}"
        - "/root"

    - name: SSH Hardening - Disable LastLog print (cleaner login)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PrintLastLog'
        line: 'PrintLastLog no'
      notify: Restart SSH Service

  handlers:
    - name: Restart SSH Service
      service:
        name: ssh
        state: restarted
