---
- name: Homelab Nodes Base Configuration (Full Productivity Edition)
  hosts: all
  become: yes

  vars:
    fastfetch_deb_url: "https://github.com/fastfetch-cli/fastfetch/releases/download/2.60.0/fastfetch-linux-amd64.deb"
    fastfetch_config_url: "https://raw.githubusercontent.com/fastfetch-cli/fastfetch/dev/presets/examples/8.jsonc"

  tasks:
    - name: Update apt cache and perform dist-upgrade
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
      register: apt_result
      until: apt_result is success
      retries: 5
      delay: 10

    - name: Install essential system tools
      apt:
        name:
          - sudo
          - curl
          - git
          - vim
          - neovim
          - tmux
          - htop
          - rsync
          - ufw
          - gnupg
          - ncurses-bin
          - fzf
        state: present

    - name: Download Fastfetch .deb package
      get_url:
        url: "{{ fastfetch_deb_url }}"
        dest: "/tmp/fastfetch.deb"
        mode: '0644'

    - name: Install Fastfetch package
      apt:
        deb: "/tmp/fastfetch.deb"
        state: present

    - name: Create Fastfetch config directories
      file:
        path: "{{ item }}/.config/fastfetch"
        state: directory
        owner: "{{ 'root' if 'root' in item else my_user }}"
        mode: '0755'
      loop:
        - "/home/{{ my_user }}"
        - "/root"

    - name: Download Fastfetch preset 8.jsonc
      get_url:
        url: "{{ fastfetch_config_url }}"
        dest: "{{ item }}/.config/fastfetch/8.jsonc"
        mode: '0644'
      loop:
        - "/home/{{ my_user }}"
        - "/root"

    - name: Create accounts and deploy keys
      user:
        name: "{{ item.name }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes
      loop:
        - { name: "{{ my_user }}", key: "{{ user_pub_key }}" }
        - { name: "ansible", key: "{{ ansible_pub_key }}" }

    - name: Deploy SSH public keys
      authorized_key:
        user: "{{ item.name }}"
        state: present
        key: "{{ lookup('file', item.key) }}"
      loop:
        - { name: "{{ my_user }}", key: "{{ user_pub_key }}" }
        - { name: "ansible", key: "{{ ansible_pub_key }}" }

    - name: Configure passwordless sudo
      copy:
        content: "{{ item }} ALL=(ALL) NOPASSWD:ALL"
        dest: "/etc/sudoers.d/{{ item }}"
        mode: '0440'
        validate: 'visudo -cf %s'
      loop:
        - "{{ my_user }}"
        - "ansible"

    - name: SSH Hardening
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?PrintLastLog', line: 'PrintLastLog no' }
      notify: Restart SSH Service

    - name: Setup Ghostty terminfo
      block:
        - name: Copy and compile Ghostty terminfo
          copy:
            src: "../files/ghostty.terminfo"
            dest: "/tmp/ghostty.terminfo"
            mode: '0644'
        - name: Compile terminfo
          command: tic -x -o /usr/share/terminfo /tmp/ghostty.terminfo
      rescue:
        - name: Log failure
          debug:
            msg: "Failed to compile Ghostty terminfo."

    - name: Set timezone and journald limit
      timezone:
        name: Europe/Warsaw

    - name: Limit journald log size
      lineinfile:
        path: /etc/systemd/journald.conf
        regexp: '^#?SystemMaxUse='
        line: 'SystemMaxUse=100M'
      notify: Restart Journald

    - name: Install QEMU Guest Agent (VMs only)
      apt:
        name: qemu-guest-agent
        state: present
      when: ansible_virtualization_type != 'lxc'

    - name: Configure Bashrc for productivity
      blockinfile:
        path: "{{ item }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        create: yes
        mode: '0644'
        block: |
          # Fastfetch autostart
          if [ -f /usr/bin/fastfetch ]; then
              fastfetch -c 8.jsonc
          fi

          # Navigation & Listing
          alias ..='cd ..'
          alias ...='cd ../..'
          alias -- -='cd -'
          alias ll='ls -lah --group-directories-first'
          alias lt='ls -ltrh'
          shopt -s autocd
          shopt -s cdspell

          # Productivity Tools
          alias v='nvim'
          alias vi='nvim'
          alias vim='nvim'
          alias a='ansible'
          alias ap='ansible-playbook'
          alias tf='terraform'
          alias d='docker'
          alias dc='docker compose'
          mkcd() { mkdir -p "$1" && cd "$1"; }

          # Git Aliases & Functions
          alias gs='git status'
          alias ga='git add'
          alias gc='git commit -m'
          alias gp='git push'
          alias gl='git pull'
          alias glog="git log --graph --oneline --decorate"
          gcp() { git add .; git commit -m "$1"; git push; }

          # Git Prompt & Colors
          GIT_PROMPT_SCRIPT=""
          [ -f /usr/lib/git-core/git-sh-prompt ] && GIT_PROMPT_SCRIPT="/usr/lib/git-core/git-sh-prompt"
          [ -f /usr/share/git-core/git-sh-prompt ] && GIT_PROMPT_SCRIPT="/usr/share/git-core/git-sh-prompt"

          if [ -n "$GIT_PROMPT_SCRIPT" ]; then
              source "$GIT_PROMPT_SCRIPT"
              export GIT_PS1_SHOWDIRTYSTATE=1
              export GIT_PS1_SHOWUNTRACKEDFILES=1
              if [ "$USER" = "root" ]; then
                  export PS1='\[\e[1;31m\][\u@\h \[\e[1;34m\]\w\[\e[1;31m\]]\[\e[1;33m\]$(__git_ps1 " (%s)")\[\e[0m\] \# '
              else
                  export PS1='\[\e[1;32m\][\u@\h \[\e[1;34m\]\w\[\e[1;32m\]]\[\e[1;33m\]$(__git_ps1 " (%s)")\[\e[0m\] \$ '
              fi
          fi
      loop:
        - "/home/{{ my_user }}/.bashrc"
        - "/root/.bashrc"

    - name: Cleanup
      file:
        path: "/tmp/fastfetch.deb"
        state: absent

  handlers:
    - name: Restart SSH Service
      service:
        name: ssh
        state: restarted

    - name: Restart Journald
      service:
        name: systemd-journald
        state: restarted
