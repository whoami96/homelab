---
- name: Full System Update and Maintenance
  hosts: all
  become: yes
  serial: 1

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
      register: apt_update
      until: apt_update is success
      retries: 3
      delay: 5

    - name: Upgrade all packages (dist-upgrade)
      apt:
        upgrade: dist
        autoremove: yes
        purge: yes
      register: upgrade_result

    - name: Check if a reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Display message if reboot is needed
      debug:
        msg: "Zasoby systemowe na hostcie {{ inventory_hostname }} wymagają restartu po aktualizacji kernela/bibliotek!"
      when: reboot_required_file.stat.exists

    - name: Reboot the server if required
      reboot:
        msg: "Reboot initiated by Ansible after system update"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: reboot_required_file.stat.exists

    - name: Summary of changed packages
      debug:
        var: upgrade_result.stdout_lines
      when: upgrade_result.changed