---
- name: Nextcloud Full Deployment & Optimization (Ubuntu 24.04)
  hosts: nextcloud
  become: yes

  vars:
    nc_version: "33.0.0"
    nc_root: "/var/www/nextcloud"
    nc_data: "/var/www/nextcloud/data"
    mariadb_host: "10.0.0.15"
    npm_proxy_ip: "10.0.0.11"

  tasks:
    - name: Get secrets from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ ansible_hashi_vault_url }}"
        auth_method: approle
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
        engine_mount_point: "secrets"
        path: "{{ item }}"
      loop: ["mariadb/services", "nextcloud"]
      register: vault_results
      delegate_to: localhost
      vars: { ansible_become: false }
      become: no

    - name: Set facts from Vault
      set_fact:
        db_pass: "{{ vault_results.results[0].secret.nextcloud_password }}"
        admin_user: "{{ vault_results.results[1].secret.admin_user }}"
        admin_pass: "{{ vault_results.results[1].secret.admin_password }}"

    - name: Add Ondrej PHP PPA
      apt_repository:
        repo: 'ppa:ondrej/php'
        state: present

    - name: Install full stack (Apache, PHP 8.3, Redis, APCu)
      apt:
        name:
          - apache2
          - libapache2-mod-php
          - redis-server
          - php8.3
          - php8.3-fpm
          - php8.3-mysql
          - php8.3-common
          - php8.3-gd
          - php8.3-curl
          - php8.3-mbstring
          - php8.3-intl
          - php8.3-xml
          - php8.3-zip
          - php8.3-bcmath
          - php8.3-imagick
          - php8.3-gmp
          - php8.3-cli
          - php8.3-redis
          - php8.3-apcu
          - libmagickcore-6.q16-6-extra
          - unzip
          - acl
          - logrotate
        state: present
        update_cache: yes

    - name: Create dedicated PHP optimization config (FPM)
      copy:
        dest: "/etc/php/8.3/fpm/conf.d/99-nextcloud.ini"
        content: |
          memory_limit = 512M
          opcache.enable=1
          opcache.interned_strings_buffer=16
          opcache.memory_consumption=128
          opcache.save_comments=1
          opcache.revalidate_freq=1
          opcache.max_accelerated_files=10000
      notify: Restart PHP-FPM

    - name: Tuning PHP.ini (CLI)
      lineinfile:
        path: "/etc/php/8.3/cli/php.ini"
        regexp: "^memory_limit ="
        line: "memory_limit = 512M"

    - name: Enable Apache modules and PHP-FPM config
      command: "{{ item }}"
      loop:
        - a2enmod rewrite headers env dir mime proxy_fcgi setenvif
        - a2enconf php8.3-fpm
      notify: Restart Apache

    - name: Ensure data directory exists
      file:
        path: "{{ nc_data }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0750'

    - name: Fix permissions for Nextcloud and Data directory
      file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        recurse: yes
      loop:
        - "{{ nc_root }}"
        - "{{ nc_data }}"

    - name: Run Nextcloud Installation via OCC
      command: >
        sudo -u www-data /usr/bin/php8.3 {{ nc_root }}/occ maintenance:install
        --database "mysql" --database-name "nextcloud"
        --database-host "{{ mariadb_host }}" --database-user "nextcloud"
        --database-pass "{{ db_pass }}" --admin-user "{{ admin_user }}"
        --admin-pass "{{ admin_pass }}" --data-dir "{{ nc_data }}"
      args:
        creates: "{{ nc_root }}/config/config.php"

    - name: Apply System & Security Optimizations (OCC)
      command: "sudo -u www-data /usr/bin/php8.3 {{ nc_root }}/occ {{ item }}"
      loop:
        - "config:system:set trusted_domains 1 --value='nextcloud.homelab.whoaminet.it'"
        - "config:system:set trusted_proxies 0 --value='{{ npm_proxy_ip }}'"
        - "config:system:set overwrite.cli.url --value='https://nextcloud.homelab.whoaminet.it'"
        - "config:system:set overwriteprotocol --value='https'"
        - "config:system:set default_phone_region --value='PL'"
        - "config:system:set maintenance_window_start --value=1 --type=integer"
        - "config:system:set memcache.local --value='\\OC\\Memcache\\APCu'"
        - "config:system:set memcache.locking --value='\\OC\\Memcache\\Redis'"
        - "config:system:set redis host --value='127.0.0.1'"
        - "config:system:set redis port --value=6379 --type=integer"
        - "db:add-missing-indices"
        - "maintenance:repair --include-expensive"
      register: occ_opt
      changed_when: "'System config value' in occ_opt.stdout or 'Done' in occ_opt.stdout"

    - name: Setup System Cron for Nextcloud
      cron:
        name: "Nextcloud background jobs"
        user: "www-data"
        job: "/usr/bin/php8.3 -f {{ nc_root }}/cron.php"
        minute: "*/5"

    - name: Create logrotate config for Nextcloud
      copy:
        dest: /etc/logrotate.d/nextcloud
        content: |
          {{ nc_data }}/nextcloud.log {
              daily
              rotate 7
              copytruncate
              compress
              missingok
              notifempty
          }

    - name: Configure Apache VirtualHost
      copy:
        dest: /etc/apache2/sites-available/nextcloud.conf
        content: |
          <VirtualHost *:80>
            DocumentRoot {{ nc_root }}
            ServerName nextcloud.homelab.whoaminet.it

            <Directory {{ nc_root }}>
              Options +FollowSymlinks
              AllowOverride All
              Require all granted
            </Directory>

            # Nagłówki HSTS
            <IfModule mod_headers.c>
              Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains; preload"
            </IfModule>

            # Wsparcie dla CalDAV/CardDAV
            Redirect 301 /.well-known/carddav /remote.php/dav
            Redirect 301 /.well-known/caldav /remote.php/dav
          </VirtualHost>

    - name: Final Apache configuration
      command: "{{ item }}"
      loop:
        - a2dissite 000-default.conf
        - a2ensite nextcloud.conf
      notify: Restart Apache

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
    - name: Restart PHP-FPM
      service:
        name: php8.3-fpm
        state: restarted