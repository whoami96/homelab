---
- name: Hard Cleanup and PBS No-Subscription Setup
  hosts: pbs
  become: yes

  tasks:
    - name: 1. Wipe and Rewrite main sources.list (Debian 13 Trixie only)
      copy:
        dest: /etc/apt/sources.list
        content: |
          deb http://deb.debian.org/debian trixie main contrib non-free-remote
          deb http://deb.debian.org/debian trixie-updates main contrib non-free-remote
          deb http://security.debian.org/debian-security trixie-security main contrib non-free-remote

    - name: 2. Deep clean sources.list.d
      shell: "rm -rf /etc/apt/sources.list.d/*"
      changed_when: true

    - name: 3. Re-add Proxmox GPG key
      get_url:
        url: https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg
        dest: /etc/apt/trusted.gpg.d/proxmox-release-trixie.gpg
        mode: '0644'

    - name: 4. Add ONLY PBS No-Subscription repository
      apt_repository:
        repo: "deb http://download.proxmox.com/debian/pbs trixie pbs-no-subscription"
        state: present
        filename: pbs-no-sub

    - name: 5. Final check for any hidden enterprise files
      shell: "grep -rli 'enterprise.proxmox.com' /etc/apt/sources.list* | xargs rm -f"
      failed_when: false
      changed_when: false

    - name: 6. Force APT update (must work now)
      apt:
        update_cache: yes
      register: apt_res
      until: apt_res is success
      retries: 3
      delay: 5

    - name: 7. Ensure PBS is installed and services are healthy
      apt:
        name: proxmox-backup-server
        state: present
      notify: Restart PBS Services

  handlers:
    - name: Restart PBS Services
      service:
        name: "{{ item }}"
        state: restarted
      loop:
        - proxmox-backup
        - proxmox-backup-proxy