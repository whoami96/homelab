---
- name: Deploy Zabbix Agent 2 with Plugins (Docker & MySQL)
  hosts: all:!monitoring
  become: yes

  vars:
    zabbix_server_ip: "10.0.0.16"
    zabbix_version: "7.4"

  tasks:
    - name: Get Zabbix credentials from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ ansible_hashi_vault_url }}"
        auth_method: approle
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
        engine_mount_point: "secrets"
        path: "zabbix"
        validate_certs: false
      register: zabbix_vault
      delegate_to: localhost
      vars: { ansible_become: false }
      become: no

    - name: Set DB credential facts
      set_fact:
        zabbix_agent_db_user: "{{ zabbix_vault.secret.username }}"
        zabbix_agent_db_pass: "{{ zabbix_vault.secret.password }}"

    - name: Install Zabbix Repository (Debian)
      apt:
        deb: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/release/debian/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+debian13_all.deb"
      when: ansible_os_family == "Debian"

    - name: Update apt cache and install Zabbix Agent 2
      apt:
        name: zabbix-agent2
        update_cache: yes
        state: present

    - name: Setup Zabbix Agent for Docker
      block:
        - name: Add zabbix user to docker group
          user:
            name: zabbix
            groups: docker
            append: yes
          notify: Restart Zabbix Agent
      when: "'docker_hosts' in group_names"

    - name: Setup Zabbix Agent for MySQL
      block:
        - name: Install MariaDB client for plugin support
          apt:
            name: mariadb-client
            state: present

        - name: Create MySQL zabbix check configuration
          template:
            src: ../templates/zabbix_mysql.conf.j2
            dest: /etc/zabbix/zabbix_agent2.d/plugins.d/mysql.conf
            owner: root
            group: zabbix
            mode: '0640'
          notify: Restart Zabbix Agent
      when: "'databases' in group_names"

    - name: Configure Zabbix Agent 2 (zabbix_agent2.conf)
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^Server=', line: "Server={{ zabbix_server_ip }}" }
        - { regexp: '^# ServerActive=', line: "ServerActive=" }
        - { regexp: '^Hostname=', line: "Hostname={{ inventory_hostname }}" }
      notify: Restart Zabbix Agent

    - name: Ensure Zabbix Agent 2 is enabled and running
      systemd:
        name: zabbix-agent2
        state: started
        enabled: yes

  handlers:
    - name: Restart Zabbix Agent
      systemd:
        name: zabbix-agent2
        state: restarted
