---
- name: Install and Configure Zabbix Server 7.4
  hosts: zabbix
  become: yes

  tasks:
    - name: Get MariaDB secrets from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ ansible_hashi_vault_url }}"
        auth_method: approle
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
        engine_mount_point: "secrets"
        path: "mariadb/services"
        validate_certs: false
      register: zabbix_vault
      delegate_to: localhost
      vars: { ansible_become: false }
      become: no

    - name: Set DB password fact
      set_fact:
        zabbix_db_pass: "{{ zabbix_vault.secret.zabbix_password }}"

    - name: Ensure locales are generated
      block:
        - name: Install locales package
          apt:
            name: locales
            state: present

        - name: Enable en_US.UTF-8 in locale.gen
          lineinfile:
            path: /etc/locale.gen
            regexp: '^# en_US.UTF-8 UTF-8'
            line: 'en_US.UTF-8 UTF-8'

        - name: Generate locales
          command: locale-gen
          changed_when: true

        - name: Set system default locale
          debconf:
            name: locales
            question: locales/default_environment_locale
            value: en_US.UTF-8
            vtype: select

    - name: Install Zabbix 7.4 Repository
      apt:
        deb: "https://repo.zabbix.com/zabbix/7.4/release/debian/pool/main/z/zabbix-release/zabbix-release_latest_7.4+debian13_all.deb"

    - name: Update apt cache and install Zabbix components
      apt:
        name:
          - zabbix-server-mysql
          - zabbix-frontend-php
          - zabbix-apache-conf
          - zabbix-sql-scripts
          - zabbix-agent2
          - mariadb-client
        update_cache: yes

    - name: Configure Zabbix Server (DB Connection)
      lineinfile:
        path: /etc/zabbix/zabbix_server.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^# DBHost=localhost', line: 'DBHost=10.0.0.15' }
        - { regexp: '^# DBPassword=', line: "DBPassword={{ zabbix_db_pass }}" }
        - { regexp: '^# DBUser=zabbix', line: 'DBUser=zabbix' }

    - name: Check if Zabbix schema is already imported (count tables)
      shell: "mysql -h 10.0.0.15 -uzabbix -p{{ zabbix_db_pass }} zabbix -e 'show tables;' | wc -l"
      register: zabbix_db_count
      changed_when: false

    - name: Import Initial Schema (Zabbix 7.4 Path)
      shell: "zcat /usr/share/zabbix/sql-scripts/mysql/server.sql.gz | mysql -h 10.0.0.15 -uzabbix -p{{ zabbix_db_pass }} zabbix"
      when: zabbix_db_count.stdout | int < 10

    - name: Set Timezone for Zabbix PHP
      lineinfile:
        path: /etc/zabbix/apache.conf
        regexp: '^# php_value date.timezone Europe/Riga'
        line: '        php_value date.timezone Europe/Warsaw'

    - name: Enable and Restart Zabbix Services
      systemd:
        name: "{{ item }}"
        state: restarted
        enabled: yes
        daemon_reload: yes
      loop:
        - zabbix-server
        - zabbix-agent2
        - apache2