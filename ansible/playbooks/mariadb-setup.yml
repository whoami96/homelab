---
- name: MariaDB Server Setup with Service Databases (Vault & AppRole)
  hosts: mariadb
  become: yes

  vars:
    mariadb_bind_address: "0.0.0.0"
    services_to_setup:
      - { name: 'zabbix', secret_key: 'zabbix_password' }
      - { name: 'semaphore', secret_key: 'semaphore_password' }
      - { name: 'nextcloud', secret_key: 'nextcloud_password' }
      - { name: 'gitea', secret_key: 'gitea_password' }

  tasks:
    - name: Get all MariaDB secrets from Vault
      community.hashi_vault.vault_kv2_get:
        url: "{{ ansible_hashi_vault_url }}"
        auth_method: approle
        role_id: "{{ vault_role_id }}"
        secret_id: "{{ vault_secret_id }}"
        engine_mount_point: "secrets"
        path: "mariadb/services"
        validate_certs: false
      register: mariadb_vault
      delegate_to: localhost
      vars:
        ansible_become: false
      become: no

    - name: Set root password fact
      set_fact:
        mariadb_root_password: "{{ mariadb_vault.secret.root_password }}"

    - name: Install MariaDB server and Python dependencies
      apt:
        name:
          - mariadb-server
          - python3-pymysql
        state: present
        update_cache: yes

    - name: Ensure MariaDB is started and enabled
      service:
        name: mariadb
        state: started
        enabled: yes

    - name: Check if root password is already set
      command: "mysqladmin -u root -p'{{ mariadb_root_password }}' ping"
      register: root_password_check
      ignore_errors: yes
      changed_when: false

    - name: Set MariaDB root password if not set
      command: >
        mariadb -u root -e "SET PASSWORD FOR 'root'@'localhost' = PASSWORD('{{ mariadb_root_password }}'); FLUSH PRIVILEGES;"
      when: root_password_check is failed or root_password_check.rc != 0

    - name: Create service databases
      mysql_db:
        name: "{{ item.name }}"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
      loop: "{{ services_to_setup }}"

    - name: Create database users for services
      mysql_user:
        name: "{{ item.name }}"
        password: "{{ mariadb_vault.secret[item.secret_key] }}"
        host: "%"
        priv: "{{ item.name }}.*:ALL"
        state: present
        login_user: root
        login_password: "{{ mariadb_root_password }}"
      loop: "{{ services_to_setup }}"

  handlers:
    - name: Restart MariaDB
      service:
        name: mariadb
        state: restarted