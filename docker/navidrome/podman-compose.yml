services:
  navidrome:
    image: docker.io/deluan/navidrome:0.59.0
    container_name: navidrome
    user: ${PUID}:${PGID}
    ports:
      - "4533:4533"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4533/ping || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_PORT: 4533
      ND_REVERSEPROXYWHITELIST: "0.0.0.0/0"
    volumes:
      - navidrome_data:/data
      - "/mnt/nexus_storage/Muzyka/:/music:ro"
    logging:
      driver: journald

volumes:
  navidrome_data:
