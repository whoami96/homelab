---
name: navidrome

services:
  navidrome:
    image: navidrome_mpv:0.52.5
    build:
      dockerfile: ./dockerfile
    container_name: navidrome
    user: 1000:1000
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_ADDRESS: 0.0.0.0
      ND_PORT: 4533
      ND_JUKEBOX_ENABLED: true
    volumes:
    - /home_dir/whoami/app_data/navidrome_data:/data
    - /home_dir/whoami/app_data/navidrome_cache:/cache
    - /srv/dev-disk-by-uuid-3f3a37df-d637-4f43-ac2e-829e82ede16f/nas_storage/Media/Muzyka:/music:ro
    group_add:
      - "29"
    devices:
      - "/dev/snd:/dev/snd"

volumes:
  navidrome_data: