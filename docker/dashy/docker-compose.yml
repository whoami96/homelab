---
name: dashy
services:
  homelab-dashboard:
    image: lissy93/dashy:3.1.0
    container_name: homelab-dashboard
    restart: always
    environment:
      - NODE_ENV=homelab-prod
    ports:
      - "4000:8081"
    volumes:
      - "/home/whoami/docker/config/homelab-dashboard/homelab-dashboard.yml:/app/user-data/conf.yml"