---
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'discord-notifications'

receivers:
  - name: 'discord-notifications'
    discord_configs:
      - webhook_url: "https://discord.com/api/webhooks/1455605871156396195/CruD0enFh6w-9LlywI2N4rI7A1MuvO-rA6W1zyIpJDH7ZuqiwpO7rg_MZ7vQZ0AerKA5"
        send_resolved: true
        title: |
          {{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}
        message: |
          {{ range .Alerts }}
          {{ .Annotations.description }}
          {{ if eq .Status "resolved" }}*Usługa została przywrócona i działa poprawnie.*{{ end }}
          {{ end }}

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ['instance', 'alertname']
