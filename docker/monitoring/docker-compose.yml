---
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - prometheus_data:/prometheus
      - /home/whoami/docker/configs/monitoring/prometheus:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
      
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - '9093:9093'
    volumes:
      - /home/whoami/docker/configs/monitoring/alertmanager:/etc/alertmanager/
      - alertmanager-data:/data
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - /home/whoami/docker/configs/monitoring/grafana_dashboard:/etc/grafana/provisioning/datasources
    networks:
      - monitoring

  pve_exporter:
    image: prompve/prometheus-pve-exporter:3.5.5
    container_name: pve_exporter
    restart: unless-stopped
    ports:
      - '9221:9221'
    volumes:
      - /home/whoami/docker/configs/monitoring/pve/pve.yml:/etc/prometheus/pve.yml
    networks:
      - monitoring

  speedtest_exporter:
    image: ghcr.io/danopstech/speedtest_exporter:latest
    container_name: speedtest_exporter
    restart: unless-stopped
    ports:
      - '9798:9090'
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: cadvisor_exporter
    restart: unless-stopped
    ports:
      - '9998:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring

  nextcloud-exporter:
    image: ghcr.io/xperimental/nextcloud-exporter:0.8.0
    container_name: nextcloud-exporter
    restart: unless-stopped
    environment:
      - NEXTCLOUD_SERVER=${NEXTCLOUD_SERVER}
      - NEXTCLOUD_AUTH_TOKEN=${NEXTCLOUD_AUTH_TOKEN}
      - NEXTCLOUD_TLS_SKIP_VERIFY=${NEXTCLOUD_TLS_SKIP_VERIFY}
      - NEXTCLOUD_INFO_APPS=${NEXTCLOUD_INFO_APPS}
      - NEXTCLOUD_INFO_UPDATE=${NEXTCLOUD_INFO_UPDATE}
    ports:
      - "9205:9205"
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  alertmanager-data:
  grafana_data:
