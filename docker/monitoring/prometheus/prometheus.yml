global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      scheme: http
      timeout: 10s
      api_version: v2

scrape_configs:
  - job_name: node-exporter
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "10.0.0.2:9100"

  - job_name: prometheus
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "10.0.0.2:9080"

  - job_name: "cadvisor-exporter"
    static_configs:
      - targets:
          - "10.0.0.2:9998"

  - job_name: "pwrstat-exporter"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "10.0.0.2:8088"

  - job_name: "nextcloud-exporter"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "10.0.0.2:9205"
