global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
  - static_configs:
    - targets: []
    scheme: http
    timeout: 10s
    api_version: v2

scrape_configs:
- job_name: pve
  static_configs:
    - targets:
        - '192.168.0.10'
  metrics_path: /pve
  params:
    module: [default]
  relabel_configs:
    - source_labels: [__address__]
      target_label: __param_target
    - source_labels: [__param_target]
      target_label: instance
    - target_label: __address__
      replacement: 192.168.0.11:9221

- job_name: prometheus
  honor_timestamps: true
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  scheme: http
  static_configs:
  - targets:
    - 192.168.0.11:9090
    
- job_name: speedtest
  scrape_interval: 60m
  scrape_timeout:  60s
  static_configs:
  - targets:
    - 192.168.0.11:9798

- job_name: "cadvisor-exporter"
  static_configs:
  - targets:
    - 192.168.0.11:9998

- job_name: 'nextcloud'
  scrape_interval: 90s
  static_configs:
    - targets: 
      - 192.168.0.11:9205
