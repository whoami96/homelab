services:
  pihole:
    container_name: pihole
    image: docker.io/pihole/pihole:latest
    hostname: nexus
    environment:
      - TZ=Europe/Warsaw
      - FTLCONF_webserver_api_password=${PIHOLE_PASS}
      - FTLCONF_webserver_api_enabled=true
    volumes:
      - /home/whoami/configs/pihole/data:/etc/pihole
      - /home/whoami/configs/pihole/dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "10.0.0.5:53:53/tcp"
      - "10.0.0.5:53:53/udp"
      - "8070:80/tcp"
    restart: always
