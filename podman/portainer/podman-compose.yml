services:
  portainer:
    image: docker.io/portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - '9000:9000'
      - '9443:9443'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:z
      - portainer_data:/data:Z
    security_opt:
      - label=disable
    logging:
      driver: journald

volumes:
  portainer_data:
