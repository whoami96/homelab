services:
  prometheus:
    image: docker.io/prom/prometheus:v3.9.1
    container_name: prometheus
    ports:
      - '9080:9090'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - prometheus_data:/prometheus
      - ./configs/prometheus:/etc/prometheus:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  alertmanager:
    image: docker.io/prom/alertmanager:v0.31.1
    container_name: alertmanager
    ports:
      - '9093:9093'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./configs/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/data
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/data'
    networks:
      - monitoring
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  grafana:
    image: docker.io/grafana/grafana:12.3.3
    container_name: grafana
    ports:
      - '3000:3000'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana_dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - monitoring
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  loki:
    image: docker.io/grafana/loki:3.5.10
    container_name: loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - loki_data:/loki
      - ./configs/loki:/etc/loki:ro
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    networks:
      - monitoring
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  promtail:
    image: docker.io/grafana/promtail:3.5.10
    container_name: promtail
    user: "0:0"
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep [p]romtail || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./configs/promtail:/etc/promtail:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/systemd/journal:/run/systemd/journal:ro
      - /run/user/1000/systemd/journal:/run/user/1000/systemd/journal:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - monitoring
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  pwrstat-exporter:
    image: docker.io/cardif99/pwrstat-exporter:latest
    container_name: pwrstat-exporter
    ports:
      - '8088:8088'
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F98 ' /proc/net/tcp* || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - monitoring
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/usb/hiddev0:/dev/usb/hiddev0
    privileged: true
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  nextcloud-exporter:
    image: docker.io/xperimental/nextcloud-exporter:0.9.0
    container_name: nextcloud-exporter
    environment:
      - NEXTCLOUD_SERVER=${NEXTCLOUD_SERVER}
      - NEXTCLOUD_AUTH_TOKEN=${NEXTCLOUD_AUTH_TOKEN}
      - NEXTCLOUD_TLS_SKIP_VERIFY=${NEXTCLOUD_TLS_SKIP_VERIFY}
    ports:
      - "9205:9205"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9205/metrics"]
      interval: 1m
      timeout: 10s
      retries: 3
    networks:
      - monitoring
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  podman-exporter-root:
    image: quay.io/navidys/prometheus-podman-exporter
    container_name: podman-exporter-root
    networks:
      - monitoring
    network_mode: host
    pid: host
    privileged: true
    ports:
      - '9882:9882'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9882 || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3
    environment:
      - CONTAINER_HOST=unix:///run/podman/podman.sock
    command:
      - '--collector.enable-all'
      - '--web.listen-address=:9882'
    volumes:
      - /run/podman/podman.sock:/run/podman/podman.sock
      - /proc:/host/proc:ro
    user: root
    security_opt:
      - label=disable
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  podman-exporter-user:
    image: quay.io/navidys/prometheus-podman-exporter
    container_name: podman-exporter-user
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9883 || exit 1"]
      interval: 2m
      timeout: 20s
      retries: 5
    networks:
      - monitoring
    ports:
      - '9983:9882'
    network_mode: host
    privileged: true
    pid: host
    environment:
      - CONTAINER_HOST=unix:///run/user/1000/podman/podman.sock
      - HOME=/tmp
    command:
      - '--collector.enable-all'
      - '--web.listen-address=:9883'
    volumes:
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro
    user: "1000:1000"
    security_opt:
      - label=disable
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

  speedtest-exporter:
    image: docker.io/miguelndecarvalho/speedtest-exporter:latest
    container_name: speedtest-exporter
    ports:
      - '9798:9798'
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':2646 ' /proc/net/tcp* || exit 1"]
      interval: 2m
      timeout: 20s
      retries: 3
      start_period: 60s
    networks:
      - monitoring
    environment:
      - SPEEDTEST_PORT=9798
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  alertmanager-data:
  grafana_data:
  loki_data:
