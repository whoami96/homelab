global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      scheme: http
      timeout: 10s
      api_version: v2

scrape_configs:
  - job_name: node-exporter
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "10.0.0.5:9100"

  - job_name: prometheus
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: 'alertmanager'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - 'alertmanager:9093'

  - job_name: "pwrstat-exporter"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "pwrstat-exporter:8088"

  - job_name: "nextcloud-exporter"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "nextcloud-exporter:9205"

  - job_name: "podman-exporter"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - "podman-exporter:9882"

  - job_name: 'speedtest-exporter'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 60m
    scrape_timeout: 60s
    static_configs:
      - targets:
          - "speedtest-exporter:9798"

  - job_name: 'cloudflared-metrics'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - '10.0.0.5:2000'

  - job_name: 'loki'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'promtail'
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['promtail:9080']
