---
name: music-server

services:
  navidrome:
    image: deluan/navidrome:0.56.1
    container_name: navidrome
    user: 1001:1001
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_PORT: 4533
      ND_REVERSEPROXYWHITELIST: "0.0.0.0/0"
    volumes:
      - "/home/whoami/docker/volumes/NaviData:/data"
      - "/mnt/music/:/music:ro"
