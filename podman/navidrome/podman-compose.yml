services:
  navidrome:
    image: docker.io/deluan/navidrome:0.58.0
    container_name: navidrome
    user: ${PUID}:${PGID}
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_PORT: 4533
      ND_REVERSEPROXYWHITELIST: "0.0.0.0/0"
    volumes:
      - navidrome_data:/data
      - "/mnt/nexus-storage/Muzyka/:/music:ro"

volumes:
  navidrome_data:
