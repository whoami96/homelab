services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflared
    user: "1000:1000"
    environment:
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token
      - ${CLOUDFLARED_TOKEN}
    ports:
      - "2000:2000"
    volumes:
      - /etc/localtime:/etc/localtime:ro

