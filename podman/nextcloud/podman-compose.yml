services:
  nextcloud:
    image: docker.io/library/nextcloud:32.0.3
    container_name: nextcloud
    ports:
      - '8080:80'
    volumes:
      - /mnt/apps_data/nextcloud/:/var/www/html
    environment:
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_APPAPI_DEPLOYMENT_DAEMON_DEFAULT: local
      MYSQL_HOST: nextcloud-mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - nextcloud_net
    depends_on:
      - nextcloud-mariadb
    logging:
      driver: journald

  nextcloud-redis:
    image: docker.io/library/redis:8.2.2-bookworm
    container_name: nextcloud-redis
    ports:
      - '6379:6379'
    networks:
      - nextcloud_net
    logging:
      driver: journald

  nextcloud-mariadb:
    image: docker.io/library/mariadb:11.8-ubi
    container_name: nextcloud-mariadb
    ports:
      - '3306:3306'
    volumes:
      - nextcloud-mariadb_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    networks:
      - nextcloud_net
    command:
      - mysqld
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      - --bind-address=0.0.0.0
    logging:
      driver: journald

volumes:
  nextcloud-mariadb_data:

networks:
  nextcloud_net:
    driver: bridge
