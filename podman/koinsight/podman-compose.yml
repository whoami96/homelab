services:
  koinsight:
    image: ghcr.io/ko-insight/koinsight:latest
    container_name: koinsight
    restart: always
    ports:
      - '${KOINSIGHT_PORT:-3005}:3000'
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      - TZ=Europe/Warsaw
      - NODE_ENV=production
    volumes:
      - koinsight_data:/app/data
    networks:
      - koinsight_net
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

volumes:
  koinsight_data:

networks:
  koinsight_net:
    driver: bridge
